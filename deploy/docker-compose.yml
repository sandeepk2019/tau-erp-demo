# ============================================================================
# Tau ERP — Docker Compose (simplest managed deployment)
#
#   cd tau-erp
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# App:      http://SERVER_IP:3000   (put Caddy/Nginx/Traefik in front for SSL)
# Database: persisted in the named volume `tau-db` at /app/db/custom.db
# ============================================================================

services:
  tau-erp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tau-erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/db/custom.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in a .env file (openssl rand -base64 32)}
      TZ: Asia/Kolkata
    volumes:
      - tau-db:/app/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tau-db:
