# ============================================================================
# Tau ERP — Nginx alternative to Caddy (only if you prefer nginx)
# Install:  sudo cp deploy/nginx-tau-erp.conf /etc/nginx/sites-available/tau-erp
#           sudo ln -s /etc/nginx/sites-available/tau-erp /etc/nginx/sites-enabled/
#           sudo certbot --nginx -d erp.yourcompany.com     # free SSL
#           sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name erp.yourcompany.com;          # ← change to your domain

    client_max_body_size 25M;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;         # websocket support
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
